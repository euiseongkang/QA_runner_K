pipelines:
  branches:
    main:
      - step:
          name: GitHub mirror push (triggers GitHub Actions build/release)
          runs-on:
            - self.hosted
            - macos
          script:
            - git remote add github https://${GH_PAT}@github.com/euiseongkang/QA_runner_K.git
            - git push github HEAD:main
            - echo mirror push done - GitHub Actions will start the build
      - step:
          name: Sync QA rules to Open WebUI knowledge
          runs-on:
            - self.hosted
            - macos
          script:
            - python3 rag_sync.py --commit "$BITBUCKET_COMMIT"
          artifacts:
            - rag_sync_output/**
      - step:
          name: Publish QA knowledge to Google Drive
          runs-on:
            - self.hosted
            - macos
          script:
            - bash scripts/publish_distribution.sh
          artifacts:
            - distribution_output/**/report.json
  tags:
    'model-v*':
      - step:
          name: Train tagged model, publish to Drive and register Ollama
          runs-on:
            - self.hosted
            - macos
          script:
            - python3 rag_sync.py --commit "$BITBUCKET_COMMIT"
            - bash scripts/publish_distribution.sh --model
          artifacts:
            - rag_sync_output/**
            - distribution_output/**/report.json
  custom:
    publish-distribution:
      - step:
          name: Sync knowledge and publish distribution
          runs-on:
            - self.hosted
            - macos
          script:
            - python3 rag_sync.py --commit "$BITBUCKET_COMMIT"
            - QA_DRIVE_PUBLISH_ENABLED=1 bash scripts/publish_distribution.sh
          artifacts:
            - rag_sync_output/**
            - distribution_output/**/report.json
